name: CI

on:
  pull_request:
  push:
    branches: [main, rework]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Env is parsed at import (shared/config), and `next build` imports every route. These
    # placeholders only satisfy the schemas; no CI step talks to Supabase.
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:5174
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      SUPABASE_SECRET_KEY: ci-placeholder-secret-key
      JOB_SECRET: ci-only-job-secret-not-a-production-secret
      MEDIA_SIGNING_SECRET: ci-only-placeholder-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:tooling
      - run: npm run test:unit
      - run: npm run build
