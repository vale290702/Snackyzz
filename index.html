<!doctype html>
<html lang="es">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snackyzz | Un antojo. Tres formas de caer.</title>
    <meta
      name="description"
      content="Elige tus cookies favoritas, arma tu antojo y encuentra los puntos de venta de Snackyzz."

    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
