<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snackyzz | Un antojo. Tres formas de caer.</title>
    <meta
      name="description"
      content="Elige tus cookies favoritas, arma tu antojo y encuentra los puntos de venta de Snackyzz."
    />
    <meta name="theme-color" content="#F9EDE0" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  </head>
  <body>
    <!-- THESIS: Two distinct cookie collections share one cart; brand and format stay explicit.
    OWN-WORLD: Inherit Snackyzz cream, orange, chocolate, Fraunces and DM Sans.
    STORY: Choose sealed Snackyzz or freshly baked Baking Stereo, then check out together.
    FIRST VIEWPORT: Collection title and short description above a product grid and shared cart; chocolate heading for the collaboration. Mobile stacks the grid and cart.
    FORM: Existing storefront extension, user-directed; seed: two-collections-shared-cart. Signature interaction: quantities persist across collection navigation, using existing reduced-motion-aware controls.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance -->
    <div id="app"></div>
    <dialog
      id="product-dialog"
      class="product-dialog"
      aria-labelledby="dialog-title"
    ></dialog>
    <div
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <noscript
      >Activa JavaScript para ver las cookies y gestionar tu carrito. También
      puedes escribirnos a Snackyzz.cookies@gmail.com.</noscript
    >
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
